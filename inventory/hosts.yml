# =====================================================================
# 主机清单（占位模板）—— 把注释里的真实值填上即可，无需改动 playbooks。
#
# 变量约定：
#   ansible_host          服务器 IP/域名
#   ansible_user          SSH 用户（原 devops 体系中的 REMOTE_USER，需 NOPASSWD sudo）
#   xlgbis_env            test | prod（对应原 SERVER_TYPE；prod 部署时 playbook 会要求 --force 确认）
#   deploy_dir            原 DEPLOY_DIR（如 /opt/xlgbis-biz），目录结构沿用旧脚本：
#                         client / client-build / client-release / server / server-build / server-release
#   bsi                   仅 bs 主机需要：业务站标识（frp 子域名 + JWT 校验字段）
#   kl_deploy_dir         仅 kl 主机需要：kids-ledger 部署目录（如 /opt/kids-ledger）
# =====================================================================

