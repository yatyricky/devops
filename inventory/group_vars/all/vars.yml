---
# =====================================================================
# 全局变量（控制机为 WSL Ubuntu，playbook 均在 WSL 内运行）
# =====================================================================

# 两个项目源码的位置（WSL 视角的 /mnt/c 路径）。构建时会先拷贝到 WSL 本地
# 临时目录再 pnpm install/build，避免 /mnt/c 跨文件系统 IO 拖慢构建。
xlgbis_src: /mnt/c/Users/yatyr/workspace/xlgbis
kids_ledger_src: /mnt/c/Users/yatyr/workspace/kids-ledger

# 本地构建工作区与制品目录（WSL 文件系统内）
build_root: /tmp/devops-build
artifacts_dir: "{{ build_root }}/artifacts"

# 服务器上每个站点保留的旧 release 数量（超出自动清理，修复旧脚本无限膨胀问题）
release_keep: 5

# 服务器状态审计：允许对公网监听的端口（与原 ops_common.js EXPECTED_PUBLIC_PORTS 一致）
expected_public_ports: [22, 80, 443]

# 部署 prod 环境时的强制人工确认开关（-e force=yes 才会真正执行 prod 部署）
# 与原 refuseProdCi 的安全门槛对应：prod 不允许无人值守一键执行
# force: no
