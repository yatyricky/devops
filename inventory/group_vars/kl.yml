---
# =====================================================================
# kids-ledger（家庭账本）站点参数
# ansible_host / ansible_user / kl_deploy_dir / kl_domain 见 inventory/hosts.yml
# =====================================================================

kl_deploy_dir: /opt/kids-ledger
kl_port: 3050                # server/index.js 默认监听 127.0.0.1:3050
kl_service_name: kids-ledger
kl_user: www-data            # systemd 运行用户（原 README 模板用 www-data）
kl_data_dir: "{{ kl_deploy_dir }}/shared/data"   # SQLite 数据目录：release 外共享，各 release 内以软链指向
kl_healthcheck_url: "http://127.0.0.1:{{ kl_port }}/"
kl_healthcheck_status: 200
# 可选：kl_domain 配置后，部署后从控制机做端到端检查
# kl_domain: kl.example.com
