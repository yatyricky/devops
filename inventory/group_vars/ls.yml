---
# =====================================================================
# LS（公网登录服务器）站点参数 —— 对应原 ls_ops.js envSchema 与 devops/login/ 模板
# deploy_dir / xlgbis_env / ansible_host 等主机相关值见 inventory/hosts.yml
# =====================================================================

xlgbis_site: ls

# --- 域名与证书 ---
domain_name: domain.com            # 原 DOMAIN_NAME
client_address: login.domain.com   # 原 CLIENT_ADDRESS：静态站域名 + cookie 域
wildcard_cert_domain: domain.com   # 原 WILDCARD_CERT_DOMAIN（/etc/letsencrypt/live/<此值>/）

# --- frps（内网穿透服务端） ---
frp_user: frp                      # 原 FRP_USER：frps 运行用户（注意：旧 ls_apply_config.sh 硬编码过 opfrp，此处以变量统一）
frp_token_path: /etc/frp/frp_token # 原 FRP_TOKEN_PATH
frps_bind_port: 9999               # 原 FRPS_BIND_PORT：frpc↔frps 控制端口
frps_vhost_http_port: 9998         # 原 FRPS_VHOST_HTTP_PORT：nginx 反代的 vhost 端口（仅 loopback）
frps_subdomain_host: domain.com    # 原 FRPS_SUBDOMAIN_HOST：隧道发布在 <bsi>.<此值>

# --- 应用 ---
server_port: 3000                  # xlgbis-login 监听端口（nginx /api/ 反代目标）
web_server_user: deploy            # 原 WEB_SERVER_USER：运行 xlgbis-login 的系统用户
service_name: xlgbis-login

# --- login-server 运行时 .env（非密钥部分；密钥来自 vault.yml） ---
ls_debug: false
ls_subdomains_prefix_prod: "prod1,prod2"   # 原 SUBDOMAINS_PREFIX_PROD
ls_subdomains_prefix_test: "test3,test4"   # 原 SUBDOMAINS_PREFIX_TEST
ls_testers: "admin"                        # 原 TESTERS
ls_qywx_corpid: ""
ls_qywx_agent_id: ""
ls_qywx_redirect_uri: ""
ls_jwt_ttl_seconds: 3600
ls_jwt_kid: v1

# --- 部署目标（原 SITES.ls） ---
client_subdir: login-client
client_archive_prefix: login-client
client_link_packages: [common]          # login-client 经 link:../packages/common 引用
server_subdir: login-server
server_archive_prefix: login-server
server_env_template: ls/login-server.env.j2

# --- 前端构建注入（原 SITES.ls.clientEnvKeys） ---
client_vite_env:
  VITE_VERSION: "{{ release_version }}"
  VITE_DOMAIN_NAME: "{{ domain_name }}"

# --- 审计/状态（原 ls_ops.js） ---
frp_toml: frps.toml
audit_services: [xlgbis-login, frps, nginx]

# --- 健康检查 ---
client_healthcheck_url: "https://{{ client_address }}/"
client_healthcheck_status: 200
server_healthcheck_url: "https://{{ client_address }}/api/healthz"
server_healthcheck_status: 200
