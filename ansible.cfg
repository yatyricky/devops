[defaults]
# 主机清单：占位主机由使用者补全（见 README「接入服务器」）
inventory = inventory/hosts.yml
interpreter_python = auto_silent
# 保持原 devops 体系的 SSH 安全策略：拒绝未知主机指纹（首次连接见 README 的指纹导入步骤）
host_key_checking = True
retry_files_enabled = False
timeout = 15
# vault 密码文件路径（README「初始化 vault」）；用 --ask-vault-pass 可覆盖
vault_password_file = ~/.vault-pass
# 收集 facts 关闭，按需 setup 显式收集，加快巡检
gathering = explicit
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
