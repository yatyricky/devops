---
# xlgbis 服务端回滚（等价于原 deploy_server.js --roll-back <Release>）

- name: rollback | server | preflight
  ansible.builtin.fail:
    msg: "缺少 deploy_dir 或 release 参数"
  when: (deploy_dir is not defined or deploy_dir | length == 0) or (rollback_release | default('') | length == 0)

- name: rollback | server | validate release name
  ansible.builtin.fail:
    msg: "非法 release 名: {{ rollback_release }}"
  when: not (rollback_release is match('^[A-Za-z0-9._-]+$'))

- name: rollback | server | resolve target（previous = 按时间排序的上一版）
  ansible.builtin.shell: |
    cd "{{ deploy_dir }}/server-release" || exit 1
    if [ "{{ rollback_release }}" = "previous" ]; then
      cur=$(readlink "{{ deploy_dir }}/server" 2>/dev/null | xargs -r basename)
      ls -1 | sort | awk -v c="$cur" '$0==c{print p; exit} {p=$0}'
    else
      echo "{{ rollback_release }}"
    fi
  register: rollback_server_target
  changed_when: false

- name: rollback | server | target must exist
  ansible.builtin.fail:
    msg: "未找到可回滚的目标 release"
  when: rollback_server_target.stdout | trim | length == 0

- name: rollback | server | validate entry + env (原 switch_release 校验)
  ansible.builtin.stat:
    path: "{{ deploy_dir }}/server-release/{{ rollback_server_target.stdout | trim }}/{{ item }}"
  loop: [src/index.js, .env]
  register: rollback_server_entry

- name: rollback | server | files must exist
  ansible.builtin.fail:
    msg: "release 内缺少 {{ item.item }}"
  loop: "{{ rollback_server_entry.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: rollback | server | stop service
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    state: stopped
  become: true
  failed_when: false

- name: rollback | server | switch symlink
  ansible.builtin.file:
    src: "{{ deploy_dir }}/server-release/{{ rollback_server_target.stdout | trim }}/{{ server_subdir }}"
    dest: "{{ deploy_dir }}/server"
    state: link
    force: true
  become: true

- name: rollback | server | daemon-reload + reset-failed + restart
  ansible.builtin.command: "{{ item }}"
  loop:
    - systemctl daemon-reload
    - systemctl reset-failed {{ service_name }}
  become: true
  changed_when: true
  failed_when: false

- name: rollback | server | restart service
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    state: restarted
  become: true

- name: rollback | server | wait for service active
  ansible.builtin.command: systemctl is-active {{ service_name }}
  register: rollback_server_state
  until: rollback_server_state.stdout | trim == 'active'
  retries: 10
  delay: 2
  changed_when: false

- name: rollback | server | port probe
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ server_healthcheck_port }}"
    timeout: 30
  when: server_healthcheck_port is defined

- name: rollback | server | http health check
  ansible.builtin.uri:
    url: "{{ server_healthcheck_url }}"
    status_code: "{{ server_healthcheck_status | default(200) }}"
  delegate_to: localhost
  become: false
  register: rollback_server_health
  until: rollback_server_health.status == (server_healthcheck_status | default(200) | int)
  retries: 5
  delay: 3
  when: server_healthcheck_url is defined

- name: rollback | server | done
  ansible.builtin.debug:
    msg: "已回滚到 {{ rollback_server_target.stdout | trim }}"
