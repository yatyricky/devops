---
# xlgbis 前端回滚（等价于原 deploy_client.js --roll-back <Release>）

- name: rollback | client | preflight
  ansible.builtin.fail:
    msg: "缺少 deploy_dir 或 release 参数"
  when: (deploy_dir is not defined or deploy_dir | length == 0) or (rollback_release | default('') | length == 0)

- name: rollback | client | validate release name (防路径穿越，原 validateReleaseName)
  ansible.builtin.fail:
    msg: "非法 release 名: {{ rollback_release }}"
  when: not (rollback_release is match('^[A-Za-z0-9._-]+$'))

- name: rollback | client | resolve target（previous = 按时间排序的上一版）
  ansible.builtin.shell: |
    cd "{{ deploy_dir }}/client-release" || exit 1
    if [ "{{ rollback_release }}" = "previous" ]; then
      cur=$(readlink "{{ deploy_dir }}/client" 2>/dev/null | xargs -r basename)
      ls -1 | sort | awk -v c="$cur" '$0==c{print p; exit} {p=$0}'
    else
      echo "{{ rollback_release }}"
    fi
  register: rollback_client_target
  changed_when: false

- name: rollback | client | target must exist
  ansible.builtin.fail:
    msg: "未找到可回滚的目标 release（current 之前没有更早版本，或名称不存在）"
  when: rollback_client_target.stdout | trim | length == 0

- name: rollback | client | validate entry
  ansible.builtin.stat:
    path: "{{ deploy_dir }}/client-release/{{ rollback_client_target.stdout | trim }}/index.html"
  register: rollback_client_entry

- name: rollback | client | entry must exist
  ansible.builtin.fail:
    msg: "release 内缺少 index.html: {{ rollback_client_target.stdout | trim }}"
  when: not rollback_client_entry.stat.exists

- name: rollback | client | switch symlink + nginx -t + reload
  ansible.builtin.file:
    src: "{{ deploy_dir }}/client-release/{{ rollback_client_target.stdout | trim }}"
    dest: "{{ deploy_dir }}/client"
    state: link
    force: true
  become: true

- name: rollback | client | nginx config test
  ansible.builtin.command: nginx -t
  become: true
  changed_when: false

- name: rollback | client | reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  become: true

- name: rollback | client | health check
  ansible.builtin.uri:
    url: "{{ client_healthcheck_url }}"
    status_code: "{{ client_healthcheck_status | default(200) }}"
  delegate_to: localhost
  become: false
  register: rollback_client_health
  until: rollback_client_health.status == (client_healthcheck_status | default(200) | int)
  retries: 5
  delay: 3

- name: rollback | client | done
  ansible.builtin.debug:
    msg: "已回滚到 {{ rollback_client_target.stdout | trim }}"
