---
# 计算 xlgbis 部署版本号 —— 复刻原 withDeployVersion 的版本规则：
#   {ref 安全化}-{git 短 hash}[-dirty]；release 名追加 -{UTC 构建时间}
# 说明：从当前工作区 HEAD 构建（不做 git checkout，避免动到项目仓库）；
#       需要部署其他 ref 时请先在项目仓库自行 checkout。

- name: build | version | resolve git facts (delegate to controller)
  ansible.builtin.set_fact:
    xlgbis_git_hash: "{{ lookup('pipe', 'git -C ' ~ xlgbis_src ~ ' rev-parse --short HEAD') }}"
    xlgbis_git_ref: "{{ lookup('pipe', 'git -C ' ~ xlgbis_src ~ ' symbolic-ref --quiet --short HEAD 2>/dev/null || git -C ' ~ xlgbis_src ~ ' rev-parse HEAD') }}"
    xlgbis_git_dirty: "{{ (lookup('pipe', 'test -n \"$(git -C ' ~ xlgbis_src ~ ' status --porcelain)\" && echo dirty || echo clean') == 'dirty') | ternary('-dirty', '') }}"
    xlgbis_build_time: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S') }}"
  delegate_to: localhost
  run_once: true

- name: build | version | compose release names
  ansible.builtin.set_fact:
    release_version: "{{ (xlgbis_git_ref | regex_replace('[^A-Za-z0-9._-]', '_')) ~ '-' ~ xlgbis_git_hash ~ xlgbis_git_dirty }}"
  delegate_to: localhost
  run_once: true
