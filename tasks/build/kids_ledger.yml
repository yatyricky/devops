---
# kids-ledger 全栈构建（前端 dist + 后端源码，白名单打包；产物布局沿袭原 deploy.ps1：
# dist/ server/ shared/ package.json pnpm-lock.yaml pnpm-workspace.yaml start.sh 顶层平铺）
# 差异：不再打包 nginx/ 配置与 config.example.json —— nginx 站点由 apply-config 管理，
#       config.json 部署时从 vault 渲染；README/文档不进包。

- name: build | kl | assert source
  ansible.builtin.stat:
    path: "{{ kids_ledger_src }}/package.json"
  delegate_to: localhost
  run_once: true
  register: build_kl_src

- name: build | kl | source must exist
  ansible.builtin.fail:
    msg: "源码不存在: {{ kids_ledger_src }}"
  delegate_to: localhost
  run_once: true
  when: not build_kl_src.stat.exists

- name: build | kl | prepare clean workdir
  ansible.builtin.file:
    path: "{{ build_root }}/kids-ledger"
    state: "{{ item }}"
  loop: [absent, directory]
  delegate_to: localhost
  run_once: true

- name: build | kl | copy source (排除 node_modules/dist/data/config.json/日志等本地文件)
  ansible.builtin.command: >
    rsync -a --delete
    --exclude node_modules --exclude dist --exclude data --exclude config.json
    --exclude server.log --exclude '*.log' --exclude .git --exclude deploy --exclude .zcode
    {{ kids_ledger_src }}/ {{ build_root }}/kids-ledger/
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: build | kl | install deps (pnpm, frozen)
  ansible.builtin.command: pnpm install --frozen-lockfile
  args:
    chdir: "{{ build_root }}/kids-ledger"
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: build | kl | build frontend (vite)
  ansible.builtin.command: pnpm build
  args:
    chdir: "{{ build_root }}/kids-ledger"
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: build | kl | verify dist/index.html
  ansible.builtin.stat:
    path: "{{ build_root }}/kids-ledger/dist/index.html"
  delegate_to: localhost
  run_once: true
  register: build_kl_dist

- name: build | kl | dist must exist
  ansible.builtin.fail:
    msg: "构建产物缺失: dist/index.html"
  delegate_to: localhost
  run_once: true
  when: not build_kl_dist.stat.exists

- name: build | kl | assemble staging (白名单)
  ansible.builtin.file:
    path: "{{ build_root }}/kids-ledger-stage"
    state: "{{ item }}"
  loop: [absent, directory]
  delegate_to: localhost
  run_once: true

- name: build | kl | copy whitelist entries into staging
  ansible.builtin.command: >
    cp -a {{ build_root }}/kids-ledger/{{ item }} {{ build_root }}/kids-ledger-stage/
  loop: [dist, server, shared, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, start.sh]
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: build | kl | create artifact dir
  ansible.builtin.file:
    path: "{{ artifacts_dir }}"
    state: directory
  delegate_to: localhost
  run_once: true

- name: build | kl | archive (顶层平铺)
  ansible.builtin.command: >
    tar -czf {{ artifacts_dir }}/{{ release_name }}.tgz
    -C {{ build_root }}/kids-ledger-stage .
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: build | kl | expose artifact fact
  ansible.builtin.set_fact:
    artifact_path: "{{ artifacts_dir }}/{{ release_name }}.tgz"
  delegate_to: localhost
  run_once: true
