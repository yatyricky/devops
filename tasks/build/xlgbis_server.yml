---
# xlgbis 服务端源码 staging + 打包（在控制机 WSL 本地执行，产物布局与原 deploy_server.js 一致：
# tgz 内为 <server_dir>/ 与 packages/ 两个顶层目录，.env 已写入 <server_dir>/.env）

- name: build | server | compose release name
  ansible.builtin.set_fact:
    server_release_name: "{{ archive_prefix }}-{{ release_version }}-{{ xlgbis_build_time }}"
  delegate_to: localhost
  run_once: true

- name: build | server | assert source trees
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ xlgbis_src }}/{{ server_subdir }}/src/index.js"
    - "{{ xlgbis_src }}/packages/common/package.json"
  delegate_to: localhost
  run_once: true
  register: build_server_src

- name: build | server | sources must exist
  ansible.builtin.fail:
    msg: "源码缺失: {{ item.item }}（检查 xlgbis_src 与 server_subdir）"
  loop: "{{ build_server_src.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  run_once: true
  when: not item.stat.exists

- name: build | server | prepare clean staging
  ansible.builtin.file:
    path: "{{ build_root }}/{{ server_subdir }}-stage"
    state: absent
  delegate_to: localhost
  run_once: true

- name: build | server | create staging dirs
  ansible.builtin.file:
    path: "{{ build_root }}/{{ server_subdir }}-stage/packages"
    state: directory
  delegate_to: localhost
  run_once: true

- name: build | server | copy server source (原 copyDeploySource 过滤规则)
  ansible.builtin.command: >
    rsync -a --delete
    --exclude node_modules --exclude build --exclude .svelte-kit --exclude dist --exclude .env
    {{ xlgbis_src }}/{{ server_subdir }}/ {{ build_root }}/{{ server_subdir }}-stage/{{ server_subdir }}/
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: build | server | copy packages/common
  ansible.builtin.command: >
    rsync -a --delete
    --exclude node_modules --exclude build --exclude .svelte-kit --exclude .env
    {{ xlgbis_src }}/packages/common/ {{ build_root }}/{{ server_subdir }}-stage/packages/common/
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: build | server | generate runtime .env (密钥来自 vault，模板渲染后直接进包)
  ansible.builtin.template:
    src: "{{ server_env_template }}"
    dest: "{{ build_root }}/{{ server_subdir }}-stage/{{ server_subdir }}/.env"
    mode: "0600"
  delegate_to: localhost
  run_once: true

- name: build | server | create artifact dir
  ansible.builtin.file:
    path: "{{ artifacts_dir }}"
    state: directory
  delegate_to: localhost
  run_once: true

- name: build | server | archive (顶层 <server_dir>/ 与 packages/)
  ansible.builtin.command: >
    tar -czf {{ artifacts_dir }}/{{ server_release_name }}.tgz
    -C {{ build_root }}/{{ server_subdir }}-stage {{ server_subdir }} packages
  delegate_to: localhost
  run_once: true
  changed_when: true

- name: build | server | expose release facts
  ansible.builtin.set_fact:
    release_name: "{{ server_release_name }}"
    artifact_path: "{{ artifacts_dir }}/{{ server_release_name }}.tgz"
  delegate_to: localhost
  run_once: true

- name: build | server | remove staging
  ansible.builtin.file:
    path: "{{ build_root }}/{{ server_subdir }}-stage"
    state: absent
  delegate_to: localhost
  run_once: true
