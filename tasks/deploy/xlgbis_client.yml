---
# xlgbis 前端发布（目标主机上执行；目录模型与原 deploy_client.sh 完全一致：
# client-build/ 临时区 → client-release/<name>/ → client 符号链接 → nginx reload）
# 增强：部署后健康检查，失败自动切回上一个 release。

- name: deploy | client | preflight vars
  ansible.builtin.fail:
    msg: "缺少 deploy_dir（在 inventory/hosts.yml 的主机变量里配置）"
  when: deploy_dir is not defined or deploy_dir | length == 0

- name: deploy | client | ensure build dir
  ansible.builtin.file:
    path: "{{ deploy_dir }}/client-build"
    state: directory
    mode: "0755"

- name: deploy | client | upload artifact
  ansible.builtin.copy:
    src: "{{ hostvars['localhost']['artifact_path'] | default(artifact_path) }}"
    dest: "{{ deploy_dir }}/client-build/{{ release_name }}.tgz"
    mode: "0644"

- name: deploy | client | clean stale extract dir
  ansible.builtin.file:
    path: "{{ deploy_dir }}/client-build/{{ release_name }}"
    state: absent

- name: deploy | client | extract archive
  ansible.builtin.unarchive:
    src: "{{ deploy_dir }}/client-build/{{ release_name }}.tgz"
    dest: "{{ deploy_dir }}/client-build/{{ release_name }}"
    remote_src: true
    creates: "{{ deploy_dir }}/client-build/{{ release_name }}/build"

- name: deploy | client | validate index.html (原 switch_release 预检)
  ansible.builtin.stat:
    path: "{{ deploy_dir }}/client-build/{{ release_name }}/build/index.html"
  register: deploy_client_entry

- name: deploy | client | entry must exist
  ansible.builtin.fail:
    msg: "解压后未找到 index.html，产物异常"
  when: not deploy_client_entry.stat.exists

- name: deploy | client | record current release (回滚锚点)
  ansible.builtin.command: readlink {{ deploy_dir }}/client
  changed_when: false
  failed_when: false
  register: deploy_client_prev

- name: deploy | client | switch release + verify
  block:
    - name: deploy | client | remove stale release dir
      ansible.builtin.file:
        path: "{{ deploy_dir }}/client-release/{{ release_name }}"
        state: absent
      become: true

    - name: deploy | client | move build into release dir
      ansible.builtin.command: >
        mv {{ deploy_dir }}/client-build/{{ release_name }}/build
           {{ deploy_dir }}/client-release/{{ release_name }}
      become: true
      changed_when: true

    - name: deploy | client | chown to web user
      ansible.builtin.file:
        path: "{{ deploy_dir }}/client-release/{{ release_name }}"
        state: directory
        owner: "{{ web_server_user }}"
        group: "{{ web_server_user }}"
        recurse: true
      become: true

    - name: deploy | client | switch symlink
      ansible.builtin.file:
        src: "{{ deploy_dir }}/client-release/{{ release_name }}"
        dest: "{{ deploy_dir }}/client"
        state: link
        force: true
      become: true

    - name: deploy | client | nginx config test
      ansible.builtin.command: nginx -t
      become: true
      changed_when: false

    - name: deploy | client | reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      become: true

    - name: deploy | client | health check（失败触发自动回滚）
      ansible.builtin.uri:
        url: "{{ client_healthcheck_url }}"
        status_code: "{{ client_healthcheck_status | default(200) }}"
        validate_certs: true
      delegate_to: localhost
      become: false
      register: deploy_client_health
      until: deploy_client_health.status == (client_healthcheck_status | default(200) | int)
      retries: 5
      delay: 3

  rescue:
    - name: deploy | client | health/switch failed — rolling back
      ansible.builtin.debug:
        msg: "发布失败（{{ release_name }}），自动回滚到 {{ deploy_client_prev.stdout | default('无上一版本') }}"

    - name: deploy | client | restore previous release symlink
      ansible.builtin.file:
        src: "{{ deploy_client_prev.stdout }}"
        dest: "{{ deploy_dir }}/client"
        state: link
        force: true
      become: true
      when: deploy_client_prev.stdout | default('') | length > 0

    - name: deploy | client | remove symlink (首次部署，无上一版本)
      ansible.builtin.file:
        path: "{{ deploy_dir }}/client"
        state: absent
      become: true
      when: deploy_client_prev.stdout | default('') | length == 0

    - name: deploy | client | remove failed release
      ansible.builtin.file:
        path: "{{ deploy_dir }}/client-release/{{ release_name }}"
        state: absent
      become: true
      when: deploy_client_prev.stdout | default('') | length == 0

    - name: deploy | client | reload nginx after rollback
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
      become: true

    - name: deploy | client | rollback complete — fail the run
      ansible.builtin.fail:
        msg: "部署 {{ release_name }} 失败，已回滚。请查看上方错误。"

- name: deploy | client | prune old releases（修复旧脚本 release 无限膨胀）
  ansible.builtin.shell: |
    cd "{{ deploy_dir }}/client-release" &&
    ls -1 | grep -v '^current$' | sort | head -n -{{ release_keep }} | xargs -r rm -rf --
  become: true
  changed_when: true

- name: deploy | client | cleanup upload & extract
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ deploy_dir }}/client-build/{{ release_name }}"
    - "{{ deploy_dir }}/client-build/{{ release_name }}.tgz"

- name: deploy | client | cleanup local artifact
  ansible.builtin.file:
    path: "{{ artifact_path }}"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
