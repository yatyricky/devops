---
# xlgbis 服务端发布（目标主机上执行；流程与原 deploy_server.sh 一致：
# 解压校验 → pnpm install --prod → 权限修正 → 移入 server-release/ →
# stop → 切 server 链接 → daemon-reload → restart）
# 增强：服务 active 等待 + 健康检查，失败自动回滚上一 release。

- name: deploy | server | preflight vars
  ansible.builtin.fail:
    msg: "缺少 deploy_dir（在 inventory/hosts.yml 的主机变量里配置）"
  when: deploy_dir is not defined or deploy_dir | length == 0

- name: deploy | server | ensure build/release dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_dir }}/server-build"
    - "{{ deploy_dir }}/server-release"

- name: deploy | server | upload artifact
  ansible.builtin.copy:
    src: "{{ hostvars['localhost']['artifact_path'] | default(artifact_path) }}"
    dest: "{{ deploy_dir }}/server-build/{{ release_name }}.tgz"
    mode: "0644"

- name: deploy | server | clean stale extract dir
  ansible.builtin.file:
    path: "{{ deploy_dir }}/server-build/{{ release_name }}"
    state: absent

- name: deploy | server | extract archive
  ansible.builtin.unarchive:
    src: "{{ deploy_dir }}/server-build/{{ release_name }}.tgz"
    dest: "{{ deploy_dir }}/server-build/{{ release_name }}"
    remote_src: true
    creates: "{{ deploy_dir }}/server-build/{{ release_name }}/{{ server_subdir }}/package.json"

- name: deploy | server | validate release layout (原 5 项校验)
  ansible.builtin.stat:
    path: "{{ deploy_dir }}/server-build/{{ release_name }}/{{ item.path }}"
  loop:
    - { path: "{{ server_subdir }}/src/index.js" }
    - { path: "{{ server_subdir }}/package.json" }
    - { path: "{{ server_subdir }}/pnpm-lock.yaml" }
    - { path: "{{ server_subdir }}/.env" }
    - { path: "packages/common/package.json" }
  register: deploy_server_layout

- name: deploy | server | layout must be complete
  ansible.builtin.fail:
    msg: "产物缺文件: {{ item.item.path }}"
  loop: "{{ deploy_server_layout.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not item.stat.exists

- name: deploy | server | install prod deps（bash -l 兼容 nvm 安装的 node/pnpm）
  ansible.builtin.command: >
    bash -lc 'pnpm -C {{ deploy_dir }}/server-build/{{ release_name }}/{{ server_subdir }} install --prod --frozen-lockfile'
  changed_when: true

- name: deploy | server | install prod deps for packages/common
  ansible.builtin.command: >
    bash -lc 'pnpm -C {{ deploy_dir }}/server-build/{{ release_name }}/packages/common install --prod --frozen-lockfile'
  changed_when: true

- name: deploy | server | record current release (回滚锚点)
  ansible.builtin.command: readlink {{ deploy_dir }}/server
  changed_when: false
  failed_when: false
  register: deploy_server_prev

- name: deploy | server | switch release + verify
  block:
    - name: deploy | server | fix permissions (原 chmod o-w + chown)
      ansible.builtin.command: >
        chmod -R o-w {{ deploy_dir }}/server-build/{{ release_name }}
      become: true
      changed_when: true

    - name: deploy | server | chown to web user
      ansible.builtin.file:
        path: "{{ deploy_dir }}/server-build/{{ release_name }}"
        state: directory
        owner: "{{ web_server_user }}"
        group: "{{ web_server_user }}"
        recurse: true
      become: true

    - name: deploy | server | remove stale release dir
      ansible.builtin.file:
        path: "{{ deploy_dir }}/server-release/{{ release_name }}"
        state: absent
      become: true

    - name: deploy | server | move into release dir
      ansible.builtin.command: >
        mv {{ deploy_dir }}/server-build/{{ release_name }}
           {{ deploy_dir }}/server-release/{{ release_name }}
      become: true
      changed_when: true

    - name: deploy | server | stop service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: stopped
      become: true
      failed_when: false

    - name: deploy | server | switch symlink
      ansible.builtin.file:
        src: "{{ deploy_dir }}/server-release/{{ release_name }}/{{ server_subdir }}"
        dest: "{{ deploy_dir }}/server"
        state: link
        force: true
      become: true

    - name: deploy | server | systemd daemon-reload + reset-failed
      ansible.builtin.command: "{{ item }}"
      loop:
        - systemctl daemon-reload
        - systemctl reset-failed {{ service_name }}
      become: true
      changed_when: true
      failed_when: false

    - name: deploy | server | restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
      become: true

    - name: deploy | server | wait for service active
      ansible.builtin.command: systemctl is-active {{ service_name }}
      register: deploy_server_state
      until: deploy_server_state.stdout | trim == 'active'
      retries: 10
      delay: 2
      changed_when: false

    - name: deploy | server | port probe（biz 无 /healthz，用端口探活）
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ server_healthcheck_port }}"
        timeout: 30
      when: server_healthcheck_port is defined

    - name: deploy | server | http health check（login-server 有 /healthz）
      ansible.builtin.uri:
        url: "{{ server_healthcheck_url }}"
        status_code: "{{ server_healthcheck_status | default(200) }}"
      delegate_to: localhost
      become: false
      register: deploy_server_health
      until: deploy_server_health.status == (server_healthcheck_status | default(200) | int)
      retries: 5
      delay: 3
      when: server_healthcheck_url is defined

  rescue:
    - name: deploy | server | failed — rolling back
      ansible.builtin.debug:
        msg: "发布失败（{{ release_name }}），自动回滚到 {{ deploy_server_prev.stdout | default('无上一版本') }}"

    - name: deploy | server | restore previous release symlink
      ansible.builtin.file:
        src: "{{ deploy_server_prev.stdout }}"
        dest: "{{ deploy_dir }}/server"
        state: link
        force: true
      become: true
      when: deploy_server_prev.stdout | default('') | length > 0

    - name: deploy | server | remove symlink (首次部署，无上一版本)
      ansible.builtin.file:
        path: "{{ deploy_dir }}/server"
        state: absent
      become: true
      when: deploy_server_prev.stdout | default('') | length == 0

    - name: deploy | server | remove failed release
      ansible.builtin.file:
        path: "{{ deploy_dir }}/server-release/{{ release_name }}"
        state: absent
      become: true
      when: deploy_server_prev.stdout | default('') | length == 0

    - name: deploy | server | daemon-reload
      ansible.builtin.command: systemctl daemon-reload
      become: true
      changed_when: true

    - name: deploy | server | restart previous release
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
      become: true
      failed_when: false

    - name: deploy | server | rollback complete — fail the run
      ansible.builtin.fail:
        msg: "部署 {{ release_name }} 失败，已回滚。请查看上方错误。"

- name: deploy | server | prune old releases
  ansible.builtin.shell: |
    cd "{{ deploy_dir }}/server-release" &&
    ls -1 | sort | head -n -{{ release_keep }} | xargs -r rm -rf --
  become: true
  changed_when: true

- name: deploy | server | cleanup upload & extract
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ deploy_dir }}/server-build/{{ release_name }}"
    - "{{ deploy_dir }}/server-build/{{ release_name }}.tgz"

- name: deploy | server | cleanup local artifact
  ansible.builtin.file:
    path: "{{ artifact_path }}"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
