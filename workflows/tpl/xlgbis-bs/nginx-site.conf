# Sx business host: serves static frontend and proxies /api to the biz app.
# Listens only on localhost; frpc (transport.tls) forwards the public traffic.
server {
	listen 127.0.0.1:80 default_server;
	listen [::1]:80 default_server;
	server_name _;
	server_tokens off;

	root {{LOCAL_NGINX_WEB_ROOT}};
	index index.html;

	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}

	# Biz API (biz-server) is proxied on /api/
	location /api/ {
		proxy_pass http://127.0.0.1:{{BIZ_APP_PORT}};
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
