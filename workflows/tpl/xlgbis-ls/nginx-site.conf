# Cache policy: content-hashed assets under /_app/immutable/ are immutable;
# everything else (incl. index.html) must be revalidated to avoid stale deploys.
map $uri $cache_control {
	default            "no-cache";
	~^/_app/immutable/ "public, max-age=31536000, immutable";
}

# 0. Default reject — prevents SNI mismatches from falling through to wildcard
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	ssl_reject_handshake on;
}

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;
	return 444;
}

# HTTP → HTTPS redirect for known hosts
server {
	listen 80;
	listen [::]:80;
	server_name {{CLIENT_ADDRESS}} *.{{FRPS_SUBDOMAIN_HOST}};
	server_tokens off;

	location / {
		return 301 https://$host$request_uri;
	}
}

# 1. Main website: static frontend + backend API
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name {{CLIENT_ADDRESS}};
	server_tokens off;

	ssl_certificate	 /etc/letsencrypt/live/{{WILDCARD_CERT_DOMAIN}}/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/{{WILDCARD_CERT_DOMAIN}}/privkey.pem;

	# Mozilla intermediate (TLS 1.2 + 1.3, PFS-only)
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Cache-Control $cache_control always;

	root {{DEPLOY_DIR}}/client;
	index index.html;

	location = /api {
		return 308 /api/;
	}

	location ^~ /api/ {
		proxy_pass http://127.0.0.1:{{SERVER_PORT}}/;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_hide_header Server;
		proxy_hide_header X-Powered-By;

		proxy_connect_timeout 30s;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}

	error_log /var/log/nginx/error.log warn;
}

# 2. Business tunnel: wildcard subdomains → frps vhost
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name *.{{FRPS_SUBDOMAIN_HOST}};
	server_tokens off;

	# Defense-in-depth: refuse login host if it ever reaches this block
	if ($host = "{{CLIENT_ADDRESS}}") { return 444; }

	ssl_certificate     /etc/letsencrypt/live/{{WILDCARD_CERT_DOMAIN}}/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/{{WILDCARD_CERT_DOMAIN}}/privkey.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location / {
		proxy_pass http://127.0.0.1:{{FRPS_VHOST_HTTP_PORT}};
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# WebSocket support
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

		# Hide upstream headers (FRP)
		proxy_hide_header Server;
		proxy_hide_header X-Powered-By;

		proxy_connect_timeout 60s;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;

		proxy_buffer_size 4k;
		proxy_buffers 4 32k;
		proxy_busy_buffers_size 64k;
	}

	error_log /var/log/nginx/error.log warn;
}
