<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps 控制台</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10141a; color: #d7dee8;
      font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  </style>
</head>
<body>
  <div id="app" style="height:100%"></div>
  <script>
    // rAF 兜底：部分内嵌 webview 的 requestAnimationFrame 永不投递（渲染帧缺失），
    // 导致 ResizeObserver 回调、Svelte Flow 的 handle 重测等全部失效。
    // 竞争式包装：原生 rAF 与 40ms setTimeout 同时排队，先到先执行（done 防重入，fire 时清掉落败方的定时器）。
    // 正常浏览器 rAF 16ms 先到，行为不变；失效环境由 setTimeout 兜底。
    (() => {
      const _raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : null;
      const run = (cb) => {
        let done = false;
        const fallback = setTimeout(() => fire(), 40);
        const fire = (t) => { if (done) return; done = true; clearTimeout(fallback); cb(t ?? performance.now()); };
        if (_raf) _raf(fire);
        if (done) clearTimeout(fallback);
      };
      window.requestAnimationFrame = run;
    })();
    window.__errs = [];
    window.addEventListener("error", e => window.__errs.push(String(e.message).slice(0, 300)));
    window.addEventListener("unhandledrejection", e => window.__errs.push("P:" + String(e.reason).slice(0, 300)));
    const _ce = console.error;
    console.error = (...a) => { window.__errs.push("C:" + a.map(String).join(" ").slice(0, 300)); _ce(...a); };
    // ResizeObserver 探针 + 失效兜底：若 rAF 恢复后 RO 仍不投递（800ms 内零回调），
    // 用 250ms 轮询对比尺寸并手动触发回调（含首次观察即回调的 RO 语义）。
    // 加固：无原生 RO 时不 patch（extends undefined 会当场 TypeError）；轮询表 per-instance
    // （原全局 Map 会让两个实例 observe 同一 target 时互相覆盖）；原生 RO 恢复投递后停止兜底。
    (() => {
      window.__roObserve = [];
      window.__roFire = 0;
      const _RO = window.ResizeObserver;
      if (!_RO) return;
      const instances = new Set();
      window.ResizeObserver = class extends _RO {
        constructor(cb) {
          super((entries, obs) => { window.__roFire++; cb(entries, obs); });
          this._cb = cb;
          this._polled = new Map(); // target → {w,h} 兜底轮询的上次尺寸
          instances.add(this);
        }
        observe(t) {
          window.__roObserve.push(String(t.className).slice(0, 40));
          this._polled.set(t, null);
          super.observe(t);
        }
        unobserve(t) { this._polled.delete(t); super.unobserve(t); }
        disconnect() { this._polled.clear(); super.disconnect(); }
      };
      setTimeout(() => {
        if (window.__roFire > 0) return;
        const poller = setInterval(() => {
          if (window.__roFire > 0) { clearInterval(poller); return; } // 原生 RO 已自行恢复
          for (const inst of instances) {
            for (const [t, last] of inst._polled) {
              if (!t.isConnected) { inst._polled.delete(t); continue; }
              const w = t.offsetWidth, h = t.offsetHeight;
              if (last && last.w === w && last.h === h) continue;
              inst._polled.set(t, { w, h });
              try { inst._cb([{ target: t, contentRect: { width: w, height: h, x: 0, y: 0, top: 0, left: 0 } }], null); } catch { /* 忽略 */ }
            }
          }
        }, 250);
      }, 800);
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
