---
# =====================================================================
# 统一部署入口（构建在控制机 WSL，发布到目标主机）
#
# 用法：
#   ansible-playbook deploy.yml -e "site=ls target=client env=test"
#   ansible-playbook deploy.yml -e "site=ls target=server env=test"
#   ansible-playbook deploy.yml -e "site=bs target=client env=test"
#   ansible-playbook deploy.yml -e "site=bs target=server env=test"
#   ansible-playbook deploy.yml -e "site=kl"
#
#   env=test|prod（默认 test）；prod 必须再加 -e force=yes 人工确认
#   版本取当前项目工作区 HEAD（ref-hash[-dirty]-时间戳），不做 git checkout
# =====================================================================

- name: Guard | 参数校验与 prod 保护
  hosts: "{{ 'kids_ledger' if (site | default('kl')) == 'kl' else site }}"
  gather_facts: false
  tasks:
    - name: guard | 校验参数
      ansible.builtin.assert:
        that:
          - site is defined
          - site in ['ls', 'bs', 'kl']
          - site == 'kl' or target is defined
          - site == 'kl' or target in ['client', 'server']
        fail_msg: >-
          参数不合法。示例：-e "site=ls target=client env=test" 或 -e "site=kl"

    - name: guard | prod 部署需要显式确认（对应原 refuseProdCi 门槛）
      ansible.builtin.fail:
        msg: "目标是 prod（xlgbis_env=prod）：请追加 -e force=yes 确认。"
      when:
        - xlgbis_env is defined
        - xlgbis_env == 'prod'
        - (env | default('test')) == 'prod'
        - (force | default('no')) | string != 'yes'

- name: Build | 控制机构建 + 打包
  hosts: "{{ 'kids_ledger' if (site | default('kl')) == 'kl' else site }}"
  gather_facts: false
  vars:
    archive_prefix: "{{ (client_archive_prefix | default('')) if (target | default('client')) == 'client' else (server_archive_prefix | default('')) }}"
  tasks:
    - name: build | dispatch
      block:
        - name: build | xlgbis | 版本号
          ansible.builtin.include_tasks: tasks/build/version_xlgbis.yml
          when: site in ['ls', 'bs']

        - name: build | xlgbis | 前端构建
          ansible.builtin.include_tasks: tasks/build/xlgbis_client.yml
          when: site in ['ls', 'bs'] and target == 'client'

        - name: build | xlgbis | 服务端打包
          ansible.builtin.include_tasks: tasks/build/xlgbis_server.yml
          when: site in ['ls', 'bs'] and target == 'server'

        - name: build | kids-ledger | 版本号
          ansible.builtin.include_tasks: tasks/build/version_kids_ledger.yml
          when: site == 'kl'

        - name: build | kids-ledger | 全栈构建
          ansible.builtin.include_tasks: tasks/build/kids_ledger.yml
          when: site == 'kl'
      when: site == 'kl' or (xlgbis_env | default('test')) == (env | default('test'))
      # 注：build 任务内部均 delegate_to: localhost + run_once

- name: Deploy | 目标主机发布
  hosts: "{{ 'kids_ledger' if (site | default('kl')) == 'kl' else site }}"
  gather_facts: true
  tasks:
    - name: deploy | dispatch
      block:
        - name: deploy | xlgbis | 前端发布
          ansible.builtin.include_tasks: tasks/deploy/xlgbis_client.yml
          when: site in ['ls', 'bs'] and target == 'client'

        - name: deploy | xlgbis | 服务端发布
          ansible.builtin.include_tasks: tasks/deploy/xlgbis_server.yml
          when: site in ['ls', 'bs'] and target == 'server'

        - name: deploy | kids-ledger | 全栈发布
          ansible.builtin.include_tasks: tasks/deploy/kids_ledger.yml
          when: site == 'kl'
      when: site == 'kl' or (xlgbis_env | default('test')) == (env | default('test'))
