---
# =====================================================================
# 配置下发（幂等；等价于原 ls_ops/bs_ops --apply-config 与 kids-ledger 手工步骤）
# nginx 站点 / systemd unit / frp 配置 / frp token 全部由本仓库模板管理。
#
# 用法：
#   ansible-playbook apply-config.yml -l ls-test
#   ansible-playbook apply-config.yml -l bs-prod -e force=yes
#   ansible-playbook apply-config.yml -l kl-prod        # 仅 nginx 站点 + systemd unit
#
# 安全策略：
#   * nginx -t 失败自动恢复备份（修复了原 bs_apply_config.sh 只打印不恢复的缺陷）
#   * prod 主机需要 -e force=yes
# =====================================================================

- name: Apply config | LS（公网登录服务器）
  hosts: ls
  gather_facts: false
  tasks:
    - name: cfg | ls | prod 保护
      ansible.builtin.fail:
        msg: "目标是 prod：请追加 -e force=yes 确认。"
      when:
        - xlgbis_env is defined
        - xlgbis_env == 'prod'
        - (force | default('no')) | string != 'yes'

    - name: cfg | ls | 下发配置
      ansible.builtin.include_tasks: tasks/config/ls.yml

- name: Apply config | BS（内网业务服务器）
  hosts: bs
  gather_facts: false
  tasks:
    - name: cfg | bs | prod 保护
      ansible.builtin.fail:
        msg: "目标是 prod：请追加 -e force=yes 确认。"
      when:
        - xlgbis_env is defined
        - xlgbis_env == 'prod'
        - (force | default('no')) | string != 'yes'

    - name: cfg | bs | 下发配置
      ansible.builtin.include_tasks: tasks/config/bs.yml

- name: Apply config | kids-ledger
  hosts: kids_ledger
  gather_facts: false
  tasks:
    - name: cfg | kl | 下发配置（nginx 站点 + systemd unit）
      ansible.builtin.include_tasks: tasks/config/kl.yml
