---
# =====================================================================
# 状态一览（等价于原 ls_ops/bs_ops --status，扩展覆盖 kids-ledger）
#
# 用法：
#   ansible-playbook status.yml            # 全部主机
#   ansible-playbook status.yml -l bs-test
# =====================================================================

- name: Status | 服务与当前版本
  hosts: all
  gather_facts: false
  tasks:
    - name: status | kids-ledger 主机映射
      ansible.builtin.set_fact:
        status_services: ["{{ kl_service_name }}", nginx]
        status_links:
          - { name: current, path: "{{ kl_deploy_dir }}/current" }
      when: kl_deploy_dir is defined

    - name: status | xlgbis 主机映射
      ansible.builtin.set_fact:
        status_services: "{{ audit_services }}"
        status_links:
          - { name: server, path: "{{ deploy_dir }}/server" }
          - { name: client, path: "{{ deploy_dir }}/client" }
      when: deploy_dir is defined

    - name: status | systemd 服务状态
      ansible.builtin.command: systemctl is-active {{ item }}
      changed_when: false
      failed_when: false
      loop: "{{ status_services | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: status_svc

    - name: status | 当前 release 链接
      ansible.builtin.command: readlink -f {{ item.path }}
      changed_when: false
      failed_when: false
      loop: "{{ status_links | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: status_link

    - name: status | report
      ansible.builtin.debug:
        msg: |
          {{ inventory_hostname }}（{{ xlgbis_env | default('prod') }}）
          {% for r in status_svc.results | default([]) %}
          服务  {{ r.item }}: {{ r.stdout | trim }}
          {% endfor %}
          {% for r in status_link.results | default([]) %}
          版本  {{ r.item.name }}: {{ r.stdout | trim }}
          {% endfor %}
