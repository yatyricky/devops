<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps 控制台</title>
<style>
  :root {
    --bg: #10141a; --panel: #171d26; --panel2: #1d2530; --line: #2a3442;
    --fg: #d7dee8; --dim: #8a97a8; --accent: #4da3ff; --ok: #4cc38a; --warn: #f5a623; --err: #ff6b6b;
    --mono: Consolas, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--dim); font-size: 12px; }
  header input { margin-left: auto; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 8px; width: 150px; }
  #busy { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  #busy .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  #busy.running .dot { background: var(--warn); animation: pulse 1s infinite alternate; }
  @keyframes pulse { from { opacity: .4 } to { opacity: 1 } }

  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px 20px; max-width: 1280px; margin: 0 auto; }
  #apps { display: grid; gap: 14px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .title { color: var(--dim); font-size: 12px; }
  .card .meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .badge.prod { color: var(--err); border-color: var(--err); }
  .badge.test { color: var(--ok); border-color: var(--ok); }
  .badge.missing { color: var(--warn); border-color: var(--warn); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  button.danger { border-color: var(--err); color: var(--err); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  #history { display: grid; gap: 6px; align-content: start; }
  #history h2 { font-size: 13px; color: var(--dim); margin: 4px 0; font-weight: 600; }
  .run { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 12px; }
  .run:hover { border-color: var(--accent); }
  .run .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .run.ok .st { background: var(--ok); } .run.failed .st { background: var(--err); } .run.running .st, .run.queued .st { background: var(--warn); }
  .run .app { font-weight: 600; }
  .run .time { margin-left: auto; color: var(--dim); font-size: 11px; }

  /* 日志抽屉 */
  #logPanel { position: fixed; left: 0; right: 0; bottom: 0; height: 42vh; min-height: 200px; background: var(--panel); border-top: 1px solid var(--line); display: none; flex-direction: column; z-index: 10; }
  #logPanel.open { display: flex; }
  #logPanel .bar { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--line); }
  #logPanel .bar .title { font-weight: 600; font-size: 13px; }
  #logPanel .bar .st { font-size: 12px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); }
  #logPanel .bar .st.ok { color: var(--ok); border-color: var(--ok); }
  #logPanel .bar .st.failed { color: var(--err); border-color: var(--err); }
  #logPanel .bar .st.running { color: var(--warn); border-color: var(--warn); }
  #logPanel .bar button { margin-left: auto; padding: 2px 10px; }
  #logLines { flex: 1; overflow: auto; padding: 8px 14px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
  #logLines .err { color: var(--err); } #logLines .warn { color: var(--warn); } #logLines .ok { color: var(--ok); }

  /* 模态框 */
  #overlay { position: fixed; inset: 0; background: rgba(4, 8, 14, .66); display: none; align-items: center; justify-content: center; z-index: 20; }
  #overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; width: min(520px, 92vw); }
  .modal.wide { width: min(880px, 96vw); }
  .modal h3 { margin: 0 0 12px; font-size: 15px; }
  .modal label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  .modal input, .modal select { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .modal textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 8px 10px; font: 12px/1.5 var(--mono); resize: vertical; }
  /* 工作流卡片编辑器 */
  .wf-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; }
  .wf-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 12px 0 8px; }
  .wf-tabs button { padding: 3px 10px; font-size: 12px; }
  #wfSteps { display: grid; gap: 8px; margin-top: 8px; }
  .wfcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .wfcard-head { display: flex; align-items: center; gap: 8px; }
  .wfcard-no { background: var(--accent); color: #08131f; border-radius: 6px; padding: 0 7px; font-weight: 700; font-size: 12px; }
  .wfcard-ops { margin-left: auto; display: flex; gap: 4px; }
  .wfcard-ops button { padding: 1px 8px; font-size: 12px; }
  .wfcard-desc { font-size: 12px; color: var(--dim); margin: 4px 0; }
  .wfcard-outs { margin-top: 6px; font-size: 11px; color: var(--dim); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .slot { margin-top: 6px; }
  .slot-hint { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  .slot-row { display: flex; gap: 6px; align-items: center; }
  .slot-row select, .slot-row input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  .slot textarea { background: var(--bg); }
  .slot-toggle { font-size: 12px; padding: 3px 8px; flex: none; white-space: nowrap; }
  .wf-palette { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
  .wf-palette .wf-pal { font-size: 12px; padding: 3px 8px; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .modal .hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .modal .error { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 16px; }
  .mono { font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>DevOps 控制台</h1>
  <span class="sub">所有部署均为人工触发 · prod 需输入应用名确认</span>
  <div id="busy"><span class="dot"></span><span id="busyText">空闲</span></div>
  <button id="btnNewWf" title="从 SPA 预设新建工作流应用">＋ 新建工作流</button>
  <input id="token" type="password" placeholder="token（未启用则留空）">
</header>

<main>
  <section id="apps"><div class="card">加载中…</div></section>
  <aside id="history"><h2>历史任务</h2></aside>
</main>

<div id="logPanel">
  <div class="bar">
    <span class="title" id="logTitle">-</span>
    <span class="st" id="logStatus">-</span>
    <button id="logClose">关闭</button>
  </div>
  <div id="logLines"></div>
</div>

<div id="overlay"><div class="modal" id="modalBox"></div></div>

<script>
"use strict";
const $ = sel => document.querySelector(sel);
const state = { apps: [], streamingJobId: null };

// ── API ────
function apiHeaders() {
  const t = localStorage.getItem("devops-token") || "";
  return { "Content-Type": "application/json", ...(t ? { "x-devops-token": t } : {}) };
}
async function api(path, opts = {}) {
  const res = await fetch(path, { headers: apiHeaders(), ...opts });
  if (res.status === 401) { alert("token 不正确（右上角填写）"); throw new Error("unauthorized"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

// ── 应用卡片 ────
async function refreshApps() {
  try { state.apps = await api("/api/apps"); } catch (e) { $("#apps").innerHTML = `<div class="card">加载失败：${esc(e.message)}</div>`; return; }
  $("#apps").innerHTML = state.apps.map(a => `
    <div class="card">
      <div class="head"><span class="name">${esc(a.name)}</span><span class="title">${esc(a.title)}</span></div>
      <div class="meta">
        ${a.serverType === "prod" ? '<span class="badge prod">PROD</span>' : a.serverType ? '<span class="badge test">TEST</span>' : ""}
        <span class="badge mono">${esc(a.envFile)}</span>
        ${a.envExists ? '<span class="badge">env ✓</span>' : '<span class="badge missing">env 缺失</span>'}
        <span class="badge mono">${esc(a.repoDir)}</span>
      </div>
      <div class="actions">
        ${a.tasks.map(t => taskButton(a, t)).join("")}
        ${a.source === "workflow" ? `
        <button onclick="openEditWorkflow('${esc(a.configFile)}')" style="margin-left:auto">✎ 编辑工作流</button>
        <button class="danger" onclick="deleteWorkflow('${esc(a.configFile)}','${esc(a.name)}')">删除</button>` : ""}
      </div>
    </div>`).join("") || '<div class="card">没有应用（apps/*.js 或右上角「＋ 新建工作流」创建）</div>';
}

// ── 历史 ────
async function refreshHistory() {
  try {
    const runs = await api("/api/jobs?limit=30");
    $("#history").innerHTML = "<h2>历史任务</h2>" + runs.map(r => `
      <div class="run ${r.status}" onclick="openLog('${r.id}')">
        <span class="st"></span><span class="app">${esc(r.app)}</span><span>${esc(r.task)}</span>
        ${r.options && r.options.dryRun ? '<span class="badge">dry</span>' : ""}
        <span class="time">${new Date(r.startedAt || parseInt(r.id.split("-")[0], 36) * 1000).toLocaleString("zh-CN", { hour12: false })}</span>
      </div>`).join("");
  } catch { /* 静默 */ }
}
async function refreshBusy() {
  try {
    const cur = await api("/api/current");
    const busy = $("#busy");
    if (cur) { busy.classList.add("running"); $("#busyText").textContent = `运行中: ${cur.app}/${cur.task}`; }
    else { busy.classList.remove("running"); $("#busyText").textContent = "空闲"; }
  } catch { /* 静默 */ }
}

// ── 任务执行 + SSE 流式日志 ────
async function runJob(app, task, options = {}) {
  try {
    const { id } = await api("/api/jobs", { method: "POST", body: JSON.stringify({ app, task, ...options }) });
    await streamJob(id, `${app}/${task}`);
    return id;
  } catch (e) { alert(e.message); throw e; }
}

function openLogPanel(title) {
  $("#logPanel").classList.add("open");
  $("#logTitle").textContent = title;
  $("#logLines").innerHTML = "";
  setLogStatus("-", "");
}
function setLogStatus(st, error) {
  const el = $("#logStatus");
  el.textContent = st === "ok" ? "成功" : st === "failed" ? "失败" : st === "running" ? "运行中" : st;
  el.className = "st " + st;
  if (error) appendLogLine(`[Failed] ${error}`, "err");
}
function appendLogLine(msg, cls) {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = msg;
  const box = $("#logLines");
  box.appendChild(div);
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

/** 已结束的任务直接重放日志；进行中的任务走 SSE 流。 */
async function openLog(id) {
  try {
    const run = await api(`/api/jobs/${id}`);
    const opt = run.options || {};
    openLogPanel(`${run.app}/${run.task}${opt.dryRun ? " (dry-run)" : ""}`);
    for (const l of run.logLines || []) appendLogLine(l.msg);
    setLogStatus(run.status, run.error);
    if (run.status === "queued" || run.status === "running") await streamJob(id, `${run.app}/${run.task}`, true);
  } catch (e) { alert(e.message); }
}

let streamTerminal = false;
function handleStreamEvent(evt) {
  if (evt.type === "log") {
    const m = String(evt.line.msg ?? evt.line);
    appendLogLine(m, /^\[(ERROR|WARN|Failed|remote-err)/.test(m) ? (m.includes("ERROR") || m.includes("Failed") ? "err" : "warn") : "");
  } else if (evt.type === "status") {
    setLogStatus(evt.status, evt.error);
  } else if (evt.type === "end") {
    streamTerminal = true;
    if (evt.status === "ok") appendLogLine("[Done] 任务成功", "ok");
    refreshApps();
  }
}

/** 流被中途掐断（任务静默期连接断开等）时的兜底：轮询到任务结束。 */
async function pollJob(id) {
  let seen = 0;
  for (;;) {
    let run;
    try { run = await api(`/api/jobs/${id}`); } catch { return; }
    if (!run) return;
    for (; seen < (run.logLines || []).length; seen++) appendLogLine(run.logLines[seen].msg);
    if (run.status === "ok" || run.status === "failed") {
      setLogStatus(run.status, run.error);
      if (run.status === "ok") appendLogLine("[Done] 任务成功", "ok");
      return;
    }
    await new Promise(r => setTimeout(r, 1000));
  }
}

/** fetch POST + ReadableStream 手写 SSE 解析。 */
async function streamJob(id, title, skipClear = false) {
  if (state.streamingJobId) { alert("已有任务日志在跟踪中（日志面板）"); return; }
  if (!skipClear) openLogPanel(title);
  state.streamingJobId = id;
  streamTerminal = false;
  try {
    const res = await fetch(`/api/jobs/${id}/stream`, { method: "POST", headers: apiHeaders() });
    if (!res.ok || !res.body) throw new Error(`stream ${res.status}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) {
        const line = part.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        handleStreamEvent(JSON.parse(line.slice(6)));
      }
    }
  } catch (e) {
    if ($("#logPanel").classList.contains("open")) appendLogLine(`[stream error] ${e.message}`, "err");
  } finally {
    state.streamingJobId = null;
    if (!streamTerminal) await pollJob(id);
    refreshHistory(); refreshBusy();
  }
}

// ── 任务按钮（按 manifest 动态渲染）────
const TASK_LABELS = {
  "deploy": "部署", "deploy-client": "部署前端", "deploy-server": "部署服务端",
  "rollback": "回滚", "rollback-client": "回滚前端", "rollback-server": "回滚服务端",
  "status": "状态", "apply-config": "应用配置", "nginx-config": "推送 nginx 配置",
};
function taskButton(a, t) {
  const label = TASK_LABELS[t.name] || t.name;
  const primary = t.name.startsWith("deploy") ? "primary" : "";
  return `<button class="${primary}" onclick="taskAction('${esc(a.name)}','${esc(t.name)}')">${esc(label)}</button>`;
}
function taskAction(appName, task) {
  if (task.startsWith("rollback")) return openRollback(appName, task);
  if (task.startsWith("deploy")) return openDeploy(appName, task);
  if (task === "apply-config") return openApplyConfig(appName);
  const a = state.apps.find(x => x.name === appName);
  const t = a?.tasks.find(x => x.name === task);
  if (t?.mutates && a?.serverType === "prod") return openMutatesConfirm(appName, task);
  return runJob(appName, task);
}

// ── 模态框 ────
function modal(html, wide = false) { const box = $("#modalBox"); box.innerHTML = html; box.classList.toggle("wide", wide); $("#overlay").classList.add("open"); return box; }
function closeModal() { $("#overlay").classList.remove("open"); }
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });

async function openDeploy(appName, taskName = "deploy") {
  const a = state.apps.find(x => x.name === appName);
  const taskLabel = TASK_LABELS[taskName] || taskName;
  const box = modal(`
    <h3>${esc(taskLabel)} ${esc(a.name)}</h3>
    ${a.serverType === "prod" ? '<div class="hint" style="color:var(--err)">PROD 环境：执行前需输入应用名确认</div>' : ""}
    <label>Git ref（默认 HEAD = 当前工作树）</label>
    <select id="mRef"><option value="">HEAD（当前工作树）</option></select>
    <input id="mRefText" placeholder="或手填分支/tag 名" style="margin-top:6px">
    ${a.serverType === "prod" ? '<label>输入应用名 <b>' + esc(a.name) + '</b> 以确认</label><input id="mConfirm" placeholder="' + esc(a.name) + '">' : ""}
    <div class="hint">流程：本地构建 → 打包 → SSH 上传 → release 目录 + 符号链接切换 → 服务重启（可回滚）</div>
    <div class="error" id="mError"></div>
    <div class="row">
      <button onclick="deployFromModal('${esc(appName)}', true, '${esc(taskName)}')">dry-run 预览</button>
      <button class="primary" onclick="deployFromModal('${esc(appName)}', false, '${esc(taskName)}')">部署</button>
      <button onclick="closeModal()">取消</button>
    </div>`);
  // refs 下拉（失败不阻塞手填）
  api(`/api/apps/${appName}/refs`).then(refs => {
    const sel = box.querySelector("#mRef");
    for (const r of refs.slice(0, 60)) {
      const o = document.createElement("option");
      o.value = r.name; o.textContent = `${r.refType === "tag" ? "tag " : "br  "} ${r.name}`;
      sel.appendChild(o);
    }
  }).catch(() => {});
}

async function deployFromModal(appName, dryRun, taskName = "deploy") {
  const a = state.apps.find(x => x.name === appName);
  const options = { dryRun };
  const ref = ($("#mRefText").value.trim() || $("#mRef").value || "").trim();
  if (ref) options.ref = ref;
  if (a.serverType === "prod" && !dryRun) {
    const confirm = ($("#mConfirm")?.value || "").trim();
    if (confirm !== appName) { $("#mError").textContent = `应用名确认不符（需要 "${appName}"）`; return; }
    options.confirmProd = confirm;
  }
  closeModal();
  await runJob(appName, taskName, options);
}

function openRollback(appName, taskName = "rollback") {
  const taskLabel = TASK_LABELS[taskName] || taskName;
  modal(`
    <h3>${esc(taskLabel)} ${esc(appName)}</h3>
    <label>目标 release 名称（先跑「状态」查看 releases 列表）</label>
    <input id="mRelease" placeholder="如 master-a1b2c3d-20260922081530" class="mono">
    ${state.apps.find(x => x.name === appName)?.serverType === "prod" ? '<label>输入应用名 <b>' + esc(appName) + '</b> 以确认</label><input id="mConfirm" placeholder="' + esc(appName) + '">' : ""}
    <div class="hint">回滚 = current 符号链接指回旧 release + 服务重启，不重新构建</div>
    <div class="error" id="mError"></div>
    <div class="row">
      <button class="primary" onclick="rollbackFromModal('${esc(appName)}', '${esc(taskName)}')">回滚</button>
      <button onclick="closeModal()">取消</button>
    </div>`);
}
async function rollbackFromModal(appName, taskName = "rollback") {
  const a = state.apps.find(x => x.name === appName);
  const release = ($("#mRelease").value || "").trim();
  if (!release) { $("#mError").textContent = "必须填写 release 名称"; return; }
  const options = { release };
  if (a.serverType === "prod") {
    const confirm = ($("#mConfirm")?.value || "").trim();
    if (confirm !== appName) { $("#mError").textContent = `应用名确认不符（需要 "${appName}"）`; return; }
    options.confirmProd = confirm;
  }
  closeModal();
  await runJob(appName, taskName, options);
}

function openApplyConfig(appName) {
  modal(`
    <h3>应用主机配置 ${esc(appName)}</h3>
    <div class="hint">上传并安装 nginx 站点配置与 systemd 单元（幂等，可重复执行）。变更类操作${state.apps.find(x => x.name === appName)?.serverType === "prod" ? '，<b style="color:var(--err)">prod 需确认</b>' : ""}。</div>
    ${state.apps.find(x => x.name === appName)?.serverType === "prod" ? '<label>输入应用名 <b>' + esc(appName) + '</b> 以确认</label><input id="mConfirm" placeholder="' + esc(appName) + '">' : ""}
    <div class="error" id="mError"></div>
    <div class="row">
      <button onclick="closeModal();runJob('${esc(appName)}','apply-config',{dryRun:true})">dry-run 预览</button>
      <button class="primary" onclick="applyConfigFromModal('${esc(appName)}')">执行</button>
      <button onclick="closeModal()">取消</button>
    </div>`);
}
async function applyConfigFromModal(appName) {
  const a = state.apps.find(x => x.name === appName);
  const options = {};
  if (a.serverType === "prod") {
    const confirm = ($("#mConfirm")?.value || "").trim();
    if (confirm !== appName) { $("#mError").textContent = `应用名确认不符（需要 "${appName}"）`; return; }
    options.confirmProd = confirm;
  }
  closeModal();
  await runJob(appName, "apply-config", options);
}

// ── 工作流管理（卡片式类型插槽编辑器）────
// 与 engine/workflow.js 的类型兼容表一致：引用下拉按此过滤。
const TYPE_COMPAT = {
  string: ["string", "number", "bool"], number: ["number"], bool: ["bool"],
  path: ["path"], remote_path: ["remote_path"],
  bash: ["string", "number", "bool", "path", "remote_path"],
  list: ["list"], map: ["map"],
};
const TYPE_LABEL = { string: "文本", bash: "命令", path: "本机路径", remote_path: "服务器路径", number: "数字", bool: "布尔", list: "列表", map: "键值" };
const stepMetaMap = () => Object.fromEntries((state.stepMeta || []).map(s => [s.type, s]));
const typeOfSample = v => typeof v === "number" ? "number" : typeof v === "boolean" ? "bool" : "string";
const mapToText = o => Object.entries(o || {}).map(([k, v]) => `${k}=${v}`).join("\n");

function openNewWorkflow() {
  modal(`
    <h3>新建工作流</h3>
    <label>预设</label>
    <select id="wfPreset" onchange="document.getElementById('wfSpaFields').style.display = this.value === 'spa' ? '' : 'none'">
      <option value="spa">SPA 静态站点（deploy / rollback / status）</option>
      <option value="blank">空白工作流（用原子能力自己组装步骤）</option>
    </select>
    <div id="wfSpaFields">
      <label>安装依赖命令</label><input id="wfInstall" class="mono" value="pnpm install --frozen-lockfile">
      <label>构建命令</label><input id="wfBuild" class="mono" value="pnpm build">
      <label>构建产物目录（相对仓库根）</label><input id="wfDist" class="mono" value="dist">
      <label>nginx 模板路径（可选，相对应用仓库；模板用 {{DOMAIN}} 等占位符）</label><input id="wfNginx" class="mono" placeholder="deploy/nginx.conf">
    </div>
    <label>应用名（唯一标识，字母数字 . _ -）</label><input id="wfName" class="mono" placeholder="my-site">
    <label>标题（可选）</label><input id="wfTitle">
    <label>应用仓库路径（本机，构建在此执行）</label><input id="wfRepo" class="mono" placeholder="C:/workspace/my-site">
    <label>env 文件名（放 envs/ 目录；留空自动 &lt;应用名&gt;.env）</label><input id="wfEnv" class="mono">
    <div class="hint">创建后还需在 envs/ 下建 env 文件（创建成功会弹出样例内容）。</div>
    <div class="error" id="mError"></div>
    <div class="row">
      <button class="primary" onclick="createWorkflow()">创建</button>
      <button onclick="closeModal()">取消</button>
    </div>`);
}

async function createWorkflow() {
  const preset = $("#wfPreset").value;
  const body = {
    preset,
    name: $("#wfName").value.trim(),
    title: $("#wfTitle").value.trim(),
    repoDir: $("#wfRepo").value.trim(),
    envFile: $("#wfEnv").value.trim(),
  };
  if (preset === "spa") {
    body.installCommand = $("#wfInstall").value.trim();
    body.buildCommand = $("#wfBuild").value.trim();
    body.distDir = $("#wfDist").value.trim();
    body.nginxTemplate = $("#wfNginx").value.trim();
  }
  try {
    const r = await api("/api/workflows", { method: "POST", body: JSON.stringify(body) });
    closeModal();
    await refreshApps();
    alert(`工作流已创建：workflows/${r.file}\n\n还差最后一步——创建 env 文件（内容可复制）：\n\n${r.envExample}`);
  } catch (e) { $("#mError").textContent = e.message; }
}

async function openEditWorkflow(file) {
  try {
    if (!state.stepMeta) state.stepMeta = await api("/api/step-types");
    const data = await api(`/api/workflows/${file}`);
    const json = data.json;
    for (const [k, wf] of Object.entries(json.workflows || {})) if (Array.isArray(wf)) json.workflows[k] = { steps: wf, mutates: true };
    state.wf = { file: data.file, json, task: Object.keys(json.workflows)[0], raw: false };
    renderWfEditor();
  } catch (e) { alert(e.message); }
}

/** 编辑位置可引用的产出物（更早步骤 + params + env + 内置）。 */
function wfSymbols(upto) {
  const json = state.wf.json, task = state.wf.task;
  const out = [];
  const add = (name, type, from) => out.push({ name, type, from });
  add("app", "string", "内置"); add("repoDir", "path", "内置");
  add("ref", "string", "任务选项"); add("release", "string", "任务选项");
  Object.keys(json.params || {}).forEach(k => add(k, "string", "params"));
  Object.entries(json.envSchema || {}).forEach(([k, v]) => add(k, typeOfSample(v), "env"));
  ((json.workflows[task] || {}).steps || []).forEach((s, i) => {
    if (i >= upto) return;
    const meta = stepMetaMap()[s.type];
    if (!meta) return;
    meta.outputs.forEach(o => add(o.name, o.type, `步骤${i + 1}`));
    if (s.type === "vars.set" && s.pairs) Object.keys(s.pairs).forEach(k => add(k, (s.types && s.types[k]) || "string", `步骤${i + 1}`));
  });
  return out;
}

/** 标量插槽：手动输入 ⇄ 引用下拉（下拉按类型兼容过滤）。 */
function slotScalar(p, v, symbols) {
  const isRef = typeof v === "string" && /^\{\{\w+\}\}$/.test(v.trim());
  const compat = symbols.filter(s => (TYPE_COMPAT[p.type] || []).includes(s.type));
  return `<div class="slot" data-key="${p.key}">
    <div class="slot-hint">${TYPE_LABEL[p.type] || p.type}${p.required ? " · 必填" : ""} · ${esc(p.desc || "")}</div>
    <div class="slot-row">
      <button type="button" class="slot-toggle" onclick="wfToggleSlot(this)">${isRef ? "✏ 手动" : "🔗 引用"}</button>
      <select class="slot-ref" ${isRef ? "" : 'style="display:none"'}>
        <option value="">— 选择产出物 —</option>
        ${compat.map(s => `<option value="{{${s.name}}}" ${isRef && v.trim() === "{{" + s.name + "}}" ? "selected" : ""}>${s.name}（${TYPE_LABEL[s.type] || s.type} · ${esc(s.from)}）</option>`).join("")}
      </select>
      <input class="slot-manual mono" ${isRef ? 'style="display:none"' : ""} value="${esc(typeof v === "string" ? v : v == null ? "" : String(v))}" placeholder="${p.required ? "必填" : "留空 = 不设置"}">
    </div>
  </div>`;
}

function wfCardHtml(step, i, task) {
  const meta = stepMetaMap()[step.type];
  const n = task.steps.length;
  if (!meta) {
    return `<div class="wfcard" data-idx="${i}" data-type="${esc(step.type)}"><div class="wfcard-head"><span class="wfcard-no">${i + 1}</span> <b>${esc(step.type)}</b> <span class="dim">未知类型</span></div><pre class="mono dim">${esc(JSON.stringify(step, null, 2))}</pre></div>`;
  }
  const symbols = wfSymbols(i);
  const params = meta.params.map(p => {
    const v = step[p.key];
    if (p.type === "bool") return `<div class="slot" data-key="${p.key}"><label class="inline"><input type="checkbox" ${v ? "checked" : ""}> ${esc(p.desc || p.key)}</label></div>`;
    if (p.type === "list") return `<div class="slot" data-key="${p.key}"><div class="slot-hint">${esc(p.desc || "")}（每行一项）</div><textarea rows="2">${esc((v || []).join("\n"))}</textarea></div>`;
    if (p.type === "map") return `<div class="slot" data-key="${p.key}"><div class="slot-hint">${esc(p.desc || "")}（每行 KEY=value）</div><textarea rows="3">${esc(mapToText(v))}</textarea></div>`;
    return slotScalar(p, v, symbols);
  }).join("");
  const outs = meta.outputs.map(o => `<span class="badge mono">→ ${o.name}(${TYPE_LABEL[o.type] || o.type})</span>`).join(" ");
  return `<div class="wfcard" data-idx="${i}" data-type="${esc(step.type)}">
    <div class="wfcard-head">
      <span class="wfcard-no">${i + 1}</span><b>${esc(meta.label)}</b><span class="mono dim">${esc(step.type)}</span>
      <span class="wfcard-ops">
        <button type="button" onclick="wfMove(${i},-1)" ${i === 0 ? "disabled" : ""}>↑</button>
        <button type="button" onclick="wfMove(${i},1)" ${i === n - 1 ? "disabled" : ""}>↓</button>
        <button type="button" class="danger" onclick="wfDel(${i})">✕</button>
      </span>
    </div>
    <div class="wfcard-desc">${esc(meta.desc)}</div>
    ${params}
    ${outs ? `<div class="wfcard-outs">产出物 ${outs}</div>` : ""}
  </div>`;
}

function renderWfEditor() {
  const w = state.wf, json = w.json;
  const taskNames = Object.keys(json.workflows);
  if (!json.workflows[w.task]) w.task = taskNames[0];
  const task = json.workflows[w.task];
  modal(`
    <h3>编辑工作流 <span class="mono">${esc(w.file)}</span></h3>
    <div id="wfStruct" ${w.raw ? 'style="display:none"' : ""}>
      <div class="wf-grid">
        <div><label>标题</label><input id="wfTitle" value="${esc(json.title || "")}"></div>
        <div><label>应用仓库（本机）</label><input id="wfRepo" class="mono" value="${esc(json.repoDir || "")}"></div>
        <div><label>env 文件</label><input id="wfEnv" class="mono" value="${esc(json.envFile || "")}"></div>
      </div>
      <label>params（每行 KEY=value，步骤里用 {{KEY}} 引用，类型为文本）</label>
      <textarea id="wfParams" rows="2" class="mono">${esc(mapToText(json.params))}</textarea>
      <div class="wf-tabs">
        ${taskNames.map(t => `<button class="${t === w.task ? "primary" : ""}" onclick="wfSwitchTask('${esc(t)}')">${esc(t)}${json.workflows[t].mutates === false ? ' <span class="dim">只读</span>' : ""}</button>`).join("")}
        <button onclick="wfAddTask()">＋ 任务</button>
        <button class="danger" onclick="wfDelTask()">删除当前任务</button>
        <label class="inline" style="margin-left:auto"><input id="wfMutates" type="checkbox" ${task && task.mutates !== false ? "checked" : ""}> 变更类（prod 需确认）</label>
      </div>
      <div id="wfSteps">${(task?.steps || []).map((s, i) => wfCardHtml(s, i, task)).join("") || '<div class="hint">还没有步骤，从下面添加。</div>'}</div>
      <div class="wf-palette">
        <b class="dim">＋ 添加步骤：</b>
        ${(state.stepMeta || []).map(m => `<button class="wf-pal" onclick="wfAddStep('${m.type}')" title="${esc(m.desc)}">${esc(m.label)} <span class="mono dim">${m.type}</span></button>`).join("")}
      </div>
    </div>
    <textarea id="wfRawJson" class="mono" spellcheck="false" style="height:46vh;${w.raw ? "" : "display:none"}">${esc(JSON.stringify(json, null, 2))}</textarea>
    <div class="hint" ${w.raw ? "" : 'style="display:none"'}>原始 JSON 模式：保存时同样走服务端编译 + 类型校验。</div>
    <div class="error" id="mError"></div>
    <div class="row">
      <button onclick="wfToggleRaw()">${w.raw ? "返回卡片编辑" : "原始 JSON"}</button>
      <button class="primary" onclick="wfSave()">保存（校验并生效）</button>
      <button onclick="closeModal()">取消</button>
    </div>`, true);
}

/** 把当前 DOM 值收回 state.wf.json（结构操作/保存/切原始模式前调用）。 */
function wfCollect() {
  const w = state.wf;
  if (w.raw) {
    w.json = JSON.parse($("#wfRawJson").value);
    for (const [k, wf] of Object.entries(w.json.workflows || {})) if (Array.isArray(wf)) w.json.workflows[k] = { steps: wf, mutates: true };
    return w.json;
  }
  const json = w.json;
  json.title = $("#wfTitle").value.trim();
  json.repoDir = $("#wfRepo").value.trim();
  json.envFile = $("#wfEnv").value.trim();
  json.params = mapFromText($("#wfParams").value);
  const task = json.workflows[w.task];
  if (task) {
    if ($("#wfMutates")) task.mutates = $("#wfMutates").checked;
    task.steps = [...document.querySelectorAll("#wfSteps .wfcard")].map(card => {
      const old = task.steps[+card.dataset.idx] || {};
      const type = card.dataset.type;
      const meta = stepMetaMap()[type];
      if (!meta) return { ...old, type };
      const step = { type };
      for (const p of meta.params) {
        const ctl = card.querySelector(`.slot[data-key="${p.key}"]`);
        if (!ctl) { if (old[p.key] !== undefined) step[p.key] = old[p.key]; continue; }
        if (p.type === "bool") step[p.key] = ctl.querySelector("input[type=checkbox]").checked;
        else if (p.type === "list") step[p.key] = ctl.querySelector("textarea").value.split("\n").map(s => s.trim()).filter(Boolean);
        else if (p.type === "map") step[p.key] = mapFromText(ctl.querySelector("textarea").value);
        else {
          const ref = ctl.querySelector(".slot-ref"), man = ctl.querySelector(".slot-manual");
          if (ref.style.display !== "none") { if (ref.value) step[p.key] = ref.value; }
          else if (man.value !== "") step[p.key] = man.value;
        }
      }
      return step;
    });
  }
  return json;
}
function mapFromText(text) {
  const o = {};
  for (const line of String(text).split("\n")) {
    const t = line.trim(); if (!t) continue;
    const eq = t.indexOf("="); if (eq < 1) continue;
    o[t.slice(0, eq).trim()] = t.slice(eq + 1).trim();
  }
  return o;
}

/** DOM 局部切换，无需重渲染。 */
function wfToggleSlot(btn) {
  const slot = btn.closest(".slot");
  const ref = slot.querySelector(".slot-ref"), man = slot.querySelector(".slot-manual");
  const showingRef = ref.style.display !== "none";
  ref.style.display = showingRef ? "none" : "";
  man.style.display = showingRef ? "" : "none";
  btn.textContent = showingRef ? "🔗 引用" : "✏ 手动";
}

/** 结构操作前先收回 DOM 值，改完重渲染。 */
function wfStructOps(fn) {
  try { wfCollect(); } catch (e) { $("#mError").textContent = "JSON 错误: " + e.message; return; }
  fn();
  renderWfEditor();
}
function wfMove(i, d) { wfStructOps(() => { const s = state.wf.json.workflows[state.wf.task].steps;[s[i], s[i + d]] = [s[i + d], s[i]]; }); }
function wfDel(i) { wfStructOps(() => state.wf.json.workflows[state.wf.task].steps.splice(i, 1)); }
function wfAddStep(type) { wfStructOps(() => state.wf.json.workflows[state.wf.task].steps.push({ type })); }
function wfSwitchTask(t) { wfStructOps(() => { state.wf.task = t; }); }
function wfAddTask() {
  const name = prompt("任务名（如 deploy、rollback、nginx-config）");
  if (!name) return;
  if (!/^[A-Za-z0-9._-]+$/.test(name)) { alert("非法任务名（只允许字母数字 . _ -）"); return; }
  wfStructOps(() => { state.wf.json.workflows[name] = { steps: [{ type: "log", message: "TODO" }] }; state.wf.task = name; });
}
function wfDelTask() {
  const t = state.wf.task;
  if (Object.keys(state.wf.json.workflows).length <= 1) { alert("至少保留一个任务"); return; }
  if (!confirm(`删除任务 ${t}？`)) return;
  wfStructOps(() => { delete state.wf.json.workflows[t]; state.wf.task = Object.keys(state.wf.json.workflows)[0]; });
}
function wfToggleRaw() {
  try {
    if (state.wf.raw) {
      state.wf.json = JSON.parse($("#wfRawJson").value);
      for (const [k, wf] of Object.entries(state.wf.json.workflows || {})) if (Array.isArray(wf)) state.wf.json.workflows[k] = { steps: wf, mutates: true };
      state.wf.raw = false;
    } else { wfCollect(); state.wf.raw = true; }
    renderWfEditor();
  } catch (e) { $("#mError").textContent = "JSON 错误: " + e.message; }
}
async function wfSave() {
  let json;
  try { json = wfCollect(); } catch (e) { $("#mError").textContent = "JSON 错误: " + e.message; return; }
  try {
    await api(`/api/workflows/${state.wf.file}`, { method: "PUT", body: JSON.stringify({ json }) });
  } catch (e) { $("#mError").textContent = e.message; return; }
  closeModal();
  refreshApps();
}

async function deleteWorkflow(file, appName) {
  if (!confirm(`删除工作流 ${file}？应用 ${appName} 将从列表移除（env 文件与服务器上的部署不受影响）。`)) return;
  try { await api(`/api/workflows/${file}`, { method: "DELETE" }); } catch (e) { alert(e.message); return; }
  refreshApps();
}

/** 工作流自定义的变更类任务（非 deploy/rollback/apply-config 前缀）在 prod 下的通用确认弹窗。 */
function openMutatesConfirm(appName, task) {
  modal(`
    <h3>${esc(task)} ${esc(appName)}</h3>
    <div class="hint" style="color:var(--err)">PROD 环境的变更类操作：执行前需输入应用名确认</div>
    <label>输入应用名 <b>${esc(appName)}</b> 以确认</label>
    <input id="mConfirm" placeholder="${esc(appName)}">
    <div class="error" id="mError"></div>
    <div class="row">
      <button class="primary" onclick="mutatesConfirmGo('${esc(appName)}','${esc(task)}')">执行</button>
      <button onclick="closeModal()">取消</button>
    </div>`);
}
function mutatesConfirmGo(appName, task) {
  const confirm = ($("#mConfirm")?.value || "").trim();
  if (confirm !== appName) { $("#mError").textContent = `应用名确认不符（需要 "${appName}"）`; return; }
  closeModal();
  runJob(appName, task, { confirmProd: confirm });
}

$("#btnNewWf").addEventListener("click", openNewWorkflow);

$("#logClose").addEventListener("click", () => $("#logPanel").classList.remove("open"));

  localStorage.setItem("devops-token", $("#token").value.trim());
  refreshApps(); refreshHistory();
});

// ── 启动 ────
refreshApps(); refreshHistory(); refreshBusy();
setInterval(refreshBusy, 5000);
setInterval(refreshHistory, 15000);
